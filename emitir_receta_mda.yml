name: Emitir Receta MDA Automática

on:
  repository_dispatch:
    types: [emitir_receta_mda]
  workflow_dispatch: # Botón para ejecutar manualmente desde GitHub Actions
  schedule:
    - cron: '*/30 * * * *' # Ejecuta automáticamente cada 30 min para verificar recetas pendientes

jobs:
  emitir_receta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependencias y Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Ejecutar Sincronizador y Emisor de Receta MDA
        env:
          MDA_EMAIL: ${{ secrets.MDA_EMAIL }}
          MDA_CLAVE: ${{ secrets.MDA_CLAVE }}
          MDA_CUIT_PRODUCTOR: ${{ secrets.MDA_CUIT_PRODUCTOR }}
        run: |
          python sincronizar_recetas.py
