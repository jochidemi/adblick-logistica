name: Emitir Receta MDA Automática

on:
  repository_dispatch:
    types: [emitir_receta_mda]
  workflow_dispatch:
    inputs:
      campo:
        description: 'Nombre del Campo'
        required: false
        default: 'El Carrilero'
      lote_id:
        description: 'ID MDA del Lote'
        required: false
        default: '5771'
      producto_id:
        description: 'ID MDA del Producto'
        required: false
        default: '7541'
      dosis:
        description: 'Dosis'
        required: false
        default: '2.0'
  schedule:
    - cron: '*/30 * * * *'

jobs:
  emitir_receta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias y Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Ejecutar Sincronizador y Emisor de Receta MDA
        env:
          MDA_EMAIL: ${{ secrets.MDA_EMAIL }}
          MDA_CLAVE: ${{ secrets.MDA_CLAVE }}
          MDA_CUIT_PRODUCTOR: ${{ secrets.MDA_CUIT_PRODUCTOR }}
        run: |
          python sincronizar_recetas.py
