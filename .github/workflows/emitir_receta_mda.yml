name: Emitir Receta MDA Automática

on:
  repository_dispatch:
    types: [emitir_receta_mda]
  workflow_dispatch: # Botón limpio sin casillas confusas
  schedule:
    - cron: '0 21 * * *' # Todos los días a las 18:00 hs (Arg)

jobs:
  emitir_receta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias y Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Ejecutar Sincronizador y Emisor de Receta MDA
        env:
          MDA_EMAIL: ${{ secrets.MDA_EMAIL }}
          MDA_CLAVE: ${{ secrets.MDA_CLAVE }}
          MDA_CUIT_PRODUCTOR: ${{ secrets.MDA_CUIT_PRODUCTOR }}
        run: |
          python sincronizar_recetas.py
