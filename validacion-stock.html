<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Validación Stock Insumos</title>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--brand:#FFD600;--brand-d:#C9A800;--brand-l:#FFFDE7;--dark:#18181B;--text:#111827;--sub:#6B7280;--light:#9CA3AF;--line:#E5E7EB;--bg:#F9FAFB;--card:#fff;--green:#16A34A;--green-l:#DCFCE7;--money:#15803D;--orange:#EA580C;--purple:#7C3AED;--red:#DC2626;}
*{box-sizing:border-box;}
body{margin:0;font-family:'Montserrat',-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text);font-size:14px;}
#gate{position:fixed;inset:0;background:var(--dark);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:999;text-align:center;padding:24px;}
#gate .logo-sq{width:52px;height:52px;border-radius:12px;background:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--dark);font-size:18px;}
#gate .sp{width:34px;height:34px;border:4px solid rgba(255,255,255,.15);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#gate button{font-family:inherit;background:var(--brand);color:var(--dark);border:0;border-radius:9px;padding:11px 22px;font-weight:700;font-size:14px;cursor:pointer;}
header{background:var(--dark);color:#fff;padding:13px 28px;display:flex;align-items:center;gap:12px;}
.logo-sq{width:34px;height:34px;border-radius:8px;background:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--dark);font-size:12px;flex-shrink:0;}
header h1{margin:0;font-size:17px;font-weight:700;}
header h1 span{color:var(--brand);}
header .who{margin-left:auto;font-size:12px;color:#d4d4d8;display:flex;align-items:center;gap:8px;}
.demo-badge{background:var(--brand);color:var(--dark);font-size:10px;font-weight:800;padding:3px 8px;border-radius:5px;text-transform:uppercase;letter-spacing:.05em;}
.tabs{display:flex;gap:2px;background:var(--dark);padding:0 28px;}
.tabs button{border:0;background:transparent;color:#a1a1aa;padding:11px 18px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;border-bottom:3px solid transparent;}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand);}
.wrap{max-width:1280px;margin:0 auto;padding:18px 28px 70px;}
section.tab{display:none;} section.tab.on{display:block;}
.src{font-size:12px;color:var(--sub);background:var(--brand-l);border:1px solid #f0e6a8;border-radius:8px;padding:8px 12px;margin:2px 0 14px;display:flex;align-items:center;gap:7px;}
.summary{display:flex;flex-wrap:wrap;gap:12px;margin:6px 0 18px;}
.s-item{flex:1;min-width:135px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;text-align:left;box-shadow:0 1px 2px rgba(0,0,0,.03);}
.s-item .n{font-size:23px;font-weight:800;color:var(--text);line-height:1.15;}
.s-item .l{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.04em;font-weight:600;margin-top:2px;}
.s-item.total{background:linear-gradient(135deg,#18181B,#2b2b31);border-color:var(--dark);}
.s-item.total .n{color:var(--brand);font-size:26px;} .s-item.total .l{color:#d4d4d8;}
.s-item.ok .n{color:var(--green);} .s-item.warn .n{color:var(--orange);} .s-item.pct .n{color:var(--purple);}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0 16px;}
.controls input[type=text],.controls select{padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-size:13px;font-family:inherit;background:#fff;}
.controls input[type=text]{min-width:230px;flex:1;}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;}
.seg button{border:0;background:#fff;padding:9px 14px;font-size:13px;font-family:inherit;cursor:pointer;color:var(--sub);}
.seg button.on{background:var(--brand);color:var(--dark);font-weight:700;}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;font-size:13px;font-family:inherit;cursor:pointer;color:var(--text);}
.btn:hover{background:var(--bg);}
.btn.prim{background:var(--brand);color:var(--dark);border-color:var(--brand-d);font-weight:700;}
.zona-grp{margin-bottom:6px;}
.group-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--dark);margin:16px 0 8px;padding:8px 12px;background:#f1f1f2;border-radius:9px;cursor:pointer;user-select:none;}
.group-h .chev{color:var(--sub);transition:transform .15s;font-size:11px;}
.zona-grp:not(.col) .group-h .chev{transform:rotate(90deg);}
.group-h .cnt{color:var(--sub);font-weight:600;}
.group-h .gval{margin-left:auto;color:var(--money);font-size:14px;}
.zona-grp.col .zona-body{display:none;}
.pto{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;}
.pto.okdep{border-color:#86efac;box-shadow:0 0 0 1px #86efac inset;}
.pto-h{display:flex;flex-wrap:nowrap;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;user-select:none;overflow:hidden;}
.pto-h:hover{background:#fafafa;}
.pto-h .chev{color:var(--sub);transition:transform .15s;font-size:12px;flex-shrink:0;}
.pto.open .chev{transform:rotate(90deg);}
.pto-h .name{font-weight:700;font-size:15px;flex:0 1 auto;min-width:70px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pto-h .val{font-weight:800;font-size:15px;color:var(--money);white-space:nowrap;flex-shrink:0;}
.pto-h .count{font-size:12px;color:var(--sub);white-space:nowrap;flex-shrink:0;}
.meta-in{display:flex;align-items:center;gap:5px;flex-shrink:0;}
.meta-in .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--sub);font-weight:600;}
.meta-in input{width:112px;padding:6px 9px;border:1px dashed #cbd0d6;border-radius:7px;font-size:12px;font-family:inherit;background:#fff;}
.meta-in input.zona{color:var(--purple);} .meta-in input.zona.set{border-style:solid;border-color:#c4b5fd;background:#f5f3ff;font-weight:600;}
.meta-in input.resp{color:var(--dark);} .meta-in input.resp.set{border-style:solid;border-color:#d4d4d8;background:#fafafa;font-weight:600;}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--green);background:var(--green-l);border:1px solid #86efac;border-radius:8px;padding:6px 10px;cursor:pointer;}
.chk input{width:16px;height:16px;cursor:pointer;accent-color:var(--green);}
.dep-com{flex:1 1 60px;min-width:0;}
.dep-com input{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:12px;font-family:inherit;background:#fffdf5;}
.confirm-btn{background:var(--green);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.confirm-btn:hover{background:#15803d;} .confirm-btn:disabled{opacity:.5;cursor:default;}
.confirm-btn.done{background:#e5e7eb;color:var(--money);border:1px solid #86efac;} .confirm-btn.done:hover{background:#d1fae5;}
.pto-body{display:none;border-top:1px solid var(--line);overflow-x:auto;} .pto.open .pto-body{display:block;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{text-align:left;padding:8px 14px;border-bottom:1px solid #f3f4f6;white-space:nowrap;}
th{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--sub);background:#fafafa;font-weight:600;}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;}
td.val{font-weight:700;color:var(--money);}
tr.diff td{background:#fff7ed;}
.real-in{width:92px;padding:5px 8px;border:1px solid #d1d5db;border-radius:6px;font-size:12px;font-family:inherit;text-align:right;background:#fff;}
.real-in.diff{border-color:var(--orange);background:#fff7ed;font-weight:700;color:var(--orange);}
.cat-badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;}
.c-Fertilizantes{background:#dbeafe;color:#1d4ed8;}.c-Agroquimicos{background:#ffedd5;color:var(--orange);}.c-Semillas{background:var(--green-l);color:var(--green);}.c-Otros{background:#f3f4f6;color:var(--sub);}.c-Granos{background:#fee2e2;color:#b91c1c;}.c-Herbicidas{background:#ffedd5;color:var(--orange);}.c-Insecticidas{background:#fce7f3;color:#be185d;}.c-Fungicidas{background:#ede9fe;color:var(--purple);}
.empty{text-align:center;color:var(--sub);padding:40px;}
.zbar{display:grid;grid-template-columns:170px 1fr 120px 70px;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid #f3f4f6;}
.zbar .bar{height:12px;background:#eef2f7;border-radius:6px;overflow:hidden;} .zbar .bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-d));}
.zbar .zn{font-weight:600;} .zbar .zv{text-align:right;font-weight:700;color:var(--money);} .zbar .zc{text-align:right;color:var(--sub);font-size:12px;}
.mh{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--sub);margin:24px 0 8px;}
.mh2{font-size:12px;font-weight:600;color:var(--sub);margin:0 0 8px;}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start;margin-bottom:6px;}
@media(max-width:820px){.mgrid{grid-template-columns:1fr;}}
tr.tot td{font-weight:800;background:#fafafa;border-top:2px solid var(--line);}
.foot{margin-top:30px;font-size:11px;color:var(--light);text-align:center;line-height:1.6;}
.hl{background:#fef08a;border-radius:3px;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:500;box-shadow:0 8px 30px rgba(0,0,0,.3);display:none;}
.toast.ok{background:var(--green);} .toast.err{background:var(--red);}
</style></head><body>
<div id="gate"><div class="logo-sq">ADB</div><div class="sp" id="gate-sp"></div><div id="gate-msg">Iniciando sesión con Microsoft…</div></div>
<div id="app" style="display:none;">
<header>
  <div class="logo-sq">ADB</div>
  <h1>Validación <span>Stock Insumos</span></h1>

</header>

  <button data-t="puntos">Puntos de stock</button>

<div class="wrap">
  <section class="tab on" id="tab-metricas">

    <div class="mh">Valor por zona</div>
    <div id="m-zonas"></div>
    <div class="mh">2) Pendiente de remitir — Valor por categoría</div>
    <div class="mgrid">

    </div>
  </section>
  <section class="tab" id="tab-puntos">
    <div class="src" id="src-p"></div>
    <div class="summary" id="p-stats"></div>
    <div class="controls">

      <button class="btn" id="p-exp">Expandir</button>
      <button class="btn" id="p-col">Colapsar</button>
      <button class="btn prim" id="p-export">Exportar validación</button>
    </div>
    <div id="p-list"></div>
  </section>
  <section class="tab" id="tab-pendiente">
    <div class="src" id="src-o"></div>
    <div class="summary" id="o-stats"></div>
    <div class="controls">
      <input type="text" id="o-q" placeholder="Buscar por proveedor, insumo o referencia...">
      <select id="o-ftipo"><option value="">Todos los tipos</option></select>
      <div class="seg" id="o-grp"><button data-g="prov" class="on">Por proveedor</button><button data-g="none">Sin agrupar</button></div>
      <button class="btn" id="o-exp">Expandir</button>
      <button class="btn" id="o-col">Colapsar</button>
    </div>
    <div id="o-list"></div>
  </section>
  <div class="foot" id="foot"></div>
</div>
</div>
<div class="toast" id="toast"></div>

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const fmtN=n=>Number(n).toLocaleString("es-AR",{maximumFractionDigits:2});
const usd=n=>"US$ "+Math.round(n).toLocaleString("es-AR");
function zonaOf(p){return (p in oz)?oz[p]:(ZONA[p]||"");}
function respOf(p){return (p in orr)?orr[p]:(RESP[p]||"");}
function hl(t,q){if(!q)return esc(t);const i=t.toLowerCase().indexOf(q.toLowerCase());if(i<0)return esc(t);return esc(t.slice(0,i))+"<span class=\"hl\">"+esc(t.slice(i,i+q.length))+"</span>"+esc(t.slice(i+q.length));}
function itemsOf(p){return EXIST.filter(e=>e.puntoStock===p);}
const vKey=(p,c)=>p+"||"+c;
let grp="pto", ogrp="prov";
function srcTxt(s){return "📸 Snapshot del "+s.fecha+" a las "+s.hora+" · por "+s.usuario;}
function fillSel(id,arr,ph){var el=document.getElementById(id);var cur=el.value;el.innerHTML="<option value=\"\">"+ph+"</option>"+arr.map(x=>"<option value=\""+esc(x)+"\">"+esc(x)+"</option>").join("");el.value=arr.indexOf(cur)>=0?cur:"";}
function isDiff(p,e){var k=vKey(p,e.codigo);var v=val[k]&&val[k].real;if(v===undefined||v==="")return false;return parseFloat(String(v).replace(",","."))!==e.existencia;}
function statCard(cls,n,l){return "<div class=\"s-item "+cls+"\"><div class=\"n\">"+n+"</div><div class=\"l\">"+l+"</div></div>";}

function renderMetricas(){
  document.getElementById("src-m").textContent=srcTxt(SNAP_EXIST)+(DEMO?"":RESP_DIAG);
  var valTot=EXIST.reduce((s,e)=>s+e.valor,0),items=EXIST.length,tipos=new Set(EXIST.map(e=>e.codigo)).size,deps=allPtos.length;
  var okc=allPtos.filter(p=>dep[p]&&dep[p].ok).length,pct=deps?Math.round(okc/deps*100):0,diff=0;
  EXIST.forEach(e=>{if(isDiff(e.puntoStock,e))diff++;});
  document.getElementById("m-stats").innerHTML=statCard("total",usd(valTot),"Valor total")+statCard("pct",pct+"%","Validado")+statCard("ok",okc+" / "+deps,"Depósitos chequeados")+statCard("",items,"Ítems")+statCard("",tipos,"Tipos de insumo")+statCard("warn",diff,"Ítems con diferencia");
  var zt={},zc={};
  EXIST.forEach(e=>{var z=zonaOf(e.puntoStock)||"(sin zona)";zt[z]=(zt[z]||0)+e.valor;});
  allPtos.forEach(p=>{var z=zonaOf(p)||"(sin zona)";zc[z]=(zc[z]||0)+1;});
  var arr=Object.keys(zt).map(z=>({z:z,v:zt[z],c:zc[z]})).sort((a,b)=>b.v-a.v),mx=Math.max(1,...arr.map(a=>a.v));
  document.getElementById("m-zonas").innerHTML=arr.map(a=>"<div class=\"zbar\"><div class=\"zn\">"+esc(a.z)+"</div><div class=\"bar\"><span style=\"width:"+(a.v/mx*100)+"%\"></span></div><div class=\"zv\">"+usd(a.v)+"</div><div class=\"zc\">"+a.c+" pts</div></div>").join("");
  // Desgloses estilo hoja Resumen del gerente
  document.getElementById("m-cat").innerHTML=mTable(mAgg(EXIST,e=>e.categoria,e=>e.valor),"Categoría",true,0);
  document.getElementById("m-resp").innerHTML=mTable(mAgg(EXIST,e=>respOf(e.puntoStock),e=>e.valor),"Responsable",false,10);
  document.getElementById("m-ocat").innerHTML=mTable(mAgg(OC,o=>o.tipo,o=>o.total),"Categoría",true,0);
  document.getElementById("m-oprov").innerHTML=mTable(mAgg(OC,o=>o.proveedor,o=>o.total),"Proveedor",false,10);
}
function mAgg(arr,keyFn,valFn){var m={},c={};arr.forEach(function(x){var k=keyFn(x);if(k==null||k==="")k="(sin dato)";m[k]=(m[k]||0)+valFn(x);c[k]=(c[k]||0)+1;});return Object.keys(m).map(k=>({k:k,v:m[k],n:c[k]})).sort((a,b)=>b.v-a.v);}
function mTable(rows,label,showN,topN){
  var t=rows.reduce((s,r)=>s+r.v,0)||1,list=topN?rows.slice(0,topN):rows;
  var b=list.map(r=>"<tr><td>"+esc(r.k)+"</td><td class=\"r val\">"+usd(r.v)+"</td><td class=\"r\">"+Math.round(r.v/t*100)+"%</td>"+(showN?"<td class=\"r\">"+r.n+"</td>":"")+"</tr>").join("");
  if(!topN)b+="<tr class=\"tot\"><td>Total</td><td class=\"r val\">"+usd(t)+"</td><td class=\"r\">100%</td>"+(showN?"<td class=\"r\">"+rows.reduce((s,r)=>s+r.n,0)+"</td>":"")+"</tr>";
  return "<div class=\"pto\"><div class=\"pto-body\" style=\"display:block;border-top:0;\"><table><thead><tr><th>"+label+"</th><th class=\"r\">Valor USD</th><th class=\"r\">%</th>"+(showN?"<th class=\"r\">Líneas</th>":"")+"</tr></thead><tbody>"+b+"</tbody></table></div></div>";
}

function refreshPFilters(){
  fillSel("p-fzona",[...new Set(allPtos.map(zonaOf).filter(Boolean))].sort(),"Todas las zonas");
  fillSel("p-fresp",[...new Set(allPtos.map(respOf).filter(Boolean))].sort(),"Todos los responsables");
  fillSel("p-fcat",[...new Set(EXIST.map(e=>e.categoria).filter(Boolean))].sort(),"Todas las categorías");
}
function filteredData(){
  var q=document.getElementById("p-q").value.trim().toLowerCase(),fz=document.getElementById("p-fzona").value,fr=document.getElementById("p-fresp").value,fc=document.getElementById("p-fcat").value,out=[];
  allPtos.forEach(function(p){
    var z=zonaOf(p),r=respOf(p);if(fz&&z!==fz)return;if(fr&&r!==fr)return;
    var items=itemsOf(p).filter(e=>(!fc||e.categoria===fc));
    if(q){var pm=p.toLowerCase().includes(q)||z.toLowerCase().includes(q)||r.toLowerCase().includes(q);if(!pm)items=items.filter(e=>e.nombre.toLowerCase().includes(q)||(e.codigo||"").toLowerCase().includes(q));}
    if(items.length)out.push({punto:p,zona:z,resp:r,items:items});
  });
  return out;
}
function renderPStats(data){
  var valTot=0,items=0,codes=new Set();
  data.forEach(g=>{items+=g.items.length;g.items.forEach(e=>{valTot+=e.valor;codes.add(e.codigo);});});
  document.getElementById("p-stats").innerHTML=statCard("total",usd(valTot),"Valor US$")+statCard("",data.length,"Depósitos")+statCard("",items,"Ítems")+statCard("",codes.size,"Tipos de insumo");
}
function ptoCard(g,q){
  var p=g.punto,z=g.zona,r=g.resp,tot=g.items.reduce((s,e)=>s+e.valor,0),dok=dep[p]&&dep[p].ok,dcom=(dep[p]&&dep[p].com)||"";
  var h="<div class=\"pto"+(dok?" okdep":"")+"\"><div class=\"pto-h\" onclick=\"togglePto(event,this)\">";
  h+="<span class=\"chev\">&#9654;</span><span class=\"name\">"+hl(p,q)+"</span>";
  h+="<span class=\"meta-in\"><span class=\"lbl\">Zona</span><input class=\"zona"+(z?" set":"")+"\" data-p=\""+esc(p)+"\" data-t=\"z\" value=\""+esc(z)+"\" placeholder=\"(sin zona)\" onclick=\"event.stopPropagation()\" onchange=\"setMeta(this)\"></span>";
  h+="<span class=\"meta-in\"><span class=\"lbl\">Resp.</span><input class=\"resp"+(r?" set":"")+"\" data-p=\""+esc(p)+"\" data-t=\"r\" value=\""+esc(r)+"\" placeholder=\"(sin resp.)\" onclick=\"event.stopPropagation()\" onchange=\"setMeta(this)\"></span>";
  h+="<span class=\"count\">"+g.items.length+" ítems</span><span class=\"val\">"+usd(tot)+"</span>";
  h+="<span class=\"dep-com\"><input type=\"text\" data-p=\""+esc(p)+"\" value=\""+esc(dcom)+"\" placeholder=\"Comentario del depósito...\" onclick=\"event.stopPropagation()\" onchange=\"setDepCom(this)\"></span>";
  h+="<button class=\"confirm-btn"+(dok?" done":"")+"\" onclick=\"event.stopPropagation();confirmarDeposito('"+p.replace(/'/g,"\\'")+"')\">"+(dok?"✓ Validado":"Confirmar depósito")+"</button>";
  h+="</div><div class=\"pto-body\"><table><thead><tr><th>Categoría</th><th>Código</th><th>Insumo</th><th>Unidad</th><th class=\"r\">Contable</th><th class=\"r\">Física</th><th class=\"r\">Precio U. (US$)</th><th class=\"r\">Valor (US$)</th></tr></thead><tbody>";
  var items=g.items.slice().sort(function(a,b){return String(a.categoria).localeCompare(String(b.categoria),"es")||String(a.nombre).localeCompare(String(b.nombre),"es");});
  items.forEach(function(e){
    var k=vKey(p,e.codigo),real=(val[k]&&val[k].real!==undefined)?val[k].real:"",diff=isDiff(p,e);
    h+="<tr class=\""+(diff?"diff":"")+"\"><td><span class=\"cat-badge c-"+esc(e.categoria)+"\">"+esc(e.categoria)+"</span></td><td style=\"color:var(--sub);font-family:monospace;\">"+esc(e.codigo)+"</td><td>"+hl(e.nombre,q)+"</td><td style=\"color:var(--sub);\">"+esc(e.unidad)+"</td><td class=\"r\">"+fmtN(e.existencia)+"</td><td class=\"r\"><input class=\"real-in"+(diff?" diff":"")+"\" data-k=\""+esc(k)+"\" value=\""+esc(real)+"\" placeholder=\""+fmtN(e.existencia)+"\" onchange=\"setReal(this)\"></td><td class=\"r\">"+fmtN(e.precio)+"</td><td class=\"r val\">"+usd(e.valor)+"</td></tr>";
  });
  return h+"</tbody></table></div></div>";
}
function renderPuntos(){
  var data=filteredData();refreshPFilters();renderPStats(data);
  var q=document.getElementById("p-q").value.trim().toLowerCase(),cont=document.getElementById("p-list");
  if(!data.length){cont.innerHTML="<div class=\"empty\">Sin resultados para el filtro actual.</div>";return;}
  var h="";
  if(grp==="pto"){data.sort((a,b)=>b.items.reduce((s,e)=>s+e.valor,0)-a.items.reduce((s,e)=>s+e.valor,0));data.forEach(g=>h+=ptoCard(g,q));}
  else{var zg={};data.forEach(g=>{var z=g.zona||"(sin zona)";(zg[z]=zg[z]||[]).push(g);});
    Object.keys(zg).sort().forEach(function(z){var gs=zg[z],zt=gs.reduce((s,g)=>s+g.items.reduce((a,e)=>a+e.valor,0),0),col=zcol.has(z);
      h+="<div class=\"zona-grp"+(col?" col":"")+"\"><div class=\"group-h\" onclick=\"toggleZona('"+z.replace(/'/g,"\\'")+"')\"><span class=\"chev\">&#9654;</span><span>"+esc(z)+"</span><span class=\"cnt\">"+gs.length+" puntos</span><span class=\"gval\">"+usd(zt)+"</span></div><div class=\"zona-body\">";
      gs.sort((a,b)=>b.items.reduce((s,e)=>s+e.valor,0)-a.items.reduce((s,e)=>s+e.valor,0));gs.forEach(g=>h+=ptoCard(g,q));h+="</div></div>";});}
  cont.innerHTML=h;
}
function toggleZona(z){if(zcol.has(z))zcol.delete(z);else zcol.add(z);localStorage.setItem(LS.zc,JSON.stringify([...zcol]));renderPuntos();}
function togglePto(e,el){if(e.target.tagName!=="INPUT"&&e.target.tagName!=="LABEL"&&e.target.tagName!=="BUTTON")el.parentNode.classList.toggle("open");}
function setMeta(inp){var p=inp.getAttribute("data-p"),v=inp.value.trim();if(inp.getAttribute("data-t")==="z"){if(v===(ZONA[p]||""))delete oz[p];else oz[p]=v;save(LS.z,oz);}else{if(v===(RESP[p]||""))delete orr[p];else orr[p]=v;save(LS.r,orr);}renderPuntos();}
function setReal(inp){var k=inp.getAttribute("data-k"),v=inp.value.trim();if(!val[k])val[k]={};if(v==="")delete val[k].real;else val[k].real=v;if(val[k]&&val[k].real===undefined)delete val[k];save(LS.v,val);renderPuntos();}
function setDepOk(cb){var p=cb.getAttribute("data-p");if(!dep[p])dep[p]={};dep[p].ok=cb.checked;if(!dep[p].ok&&!dep[p].com)delete dep[p];save(LS.d,dep);renderPuntos();}
function setDepCom(inp){var p=inp.getAttribute("data-p"),v=inp.value.trim();if(!dep[p])dep[p]={};if(v)dep[p].com=v;else delete dep[p].com;if(!dep[p].ok&&!dep[p].com)delete dep[p];save(LS.d,dep);}

// ===== Confirmar depósito: congela valores y guarda en ValidacionStock =====
function buildRows(p){
  var items=itemsOf(p),id=p+"|"+new Date().toISOString(),dok=!!(dep[p]&&dep[p].ok),dcom=(dep[p]&&dep[p].com)||"",fecha=new Date().toISOString(),fstock=SNAP_EXIST.fecha+" "+SNAP_EXIST.hora;
  return items.map(function(e){var k=vKey(p,e.codigo),rv=(val[k]&&val[k].real!==undefined&&val[k].real!=="")?parseFloat(String(val[k].real).replace(",",".")):null;
    return {Title:(p+" · "+e.codigo).substring(0,255),ValidacionID:id,PuntoStock:p,Zona:zonaOf(p),Responsable:respOf(p),Codigo:e.codigo,Insumo:e.nombre,Categoria:e.categoria,Unidad:e.unidad,ExistenciaSistema:e.existencia,PrecioUnitario:e.precio,ValorSistema:e.valor,CantidadReal:rv,Difiere:isDiff(p,e),ComentarioItem:(val[k]&&val[k].com)||"",ExistenciaChequeadaOK:true,ComentarioDeposito:dcom,ValidadoPor:currentUser,FechaValidacion:fecha,FechaStockValidado:fstock};});
}
async function confirmarDeposito(p){
  var rows=buildRows(p);
  function marcarValidado(){if(!dep[p])dep[p]={};dep[p].ok=true;save(LS.d,dep);renderPuntos();}
  if(DEMO){
    var csv=[Object.keys(rows[0]).join(";")].concat(rows.map(r=>Object.values(r).map(v=>v===null?"":v).join(";"))).join("\n");
    var b=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8;"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="confirmacion_"+p.replace(/[^a-z0-9]/gi,"_")+".csv";a.click();
    marcarValidado();
    toast("Demo: "+rows.length+" filas congeladas (descargadas) · depósito validado.","ok");return;
  }
  if(!confirm("Confirmar "+rows.length+" ítems del depósito \""+p+"\"? Se guardará un registro con fecha en ValidacionStock."))return;
  try{
    toast("Guardando "+rows.length+" ítems…");
    for(var i=0;i<rows.length;i+=5){await Promise.all(rows.slice(i,i+5).map(f=>spPost(CONFIG.lists.validacion,f)));await sleep(150);}
    marcarValidado();
    toast("Depósito \""+p+"\" validado ✓ ("+rows.length+" ítems)","ok");
  }catch(e){toast("Error al guardar: "+e.message,"err");}
}

function exportValid(){
  var rows=[["Punto de stock","Zona","Responsable","Chequeado OK","Comentario","Código","Insumo","Contable","Física","Difiere"]];
  allPtos.forEach(function(p){var z=zonaOf(p),r=respOf(p),dok=(dep[p]&&dep[p].ok)?"SI":"",dcom=(dep[p]&&dep[p].com)||"";
    itemsOf(p).forEach(function(e){var k=vKey(p,e.codigo),real=(val[k]&&val[k].real!==undefined)?val[k].real:"";if(real===""&&!dok&&!dcom)return;rows.push([p,z,r,dok,dcom,e.codigo,e.nombre,e.existencia,real,isDiff(p,e)?"SI":""]);});});
  var csv=rows.map(r=>r.map(function(c){var s=String(c==null?"":c);return /[",;\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(";")).join("\n");
  var b=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8;"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="validacion_stock.csv";a.click();
}

// ===== Pendiente de remitir (agrupado por proveedor) =====
function renderOCStats(rows){
  var tot=rows.reduce((s,o)=>s+o.total,0),provs=new Set(rows.map(o=>o.proveedor)).size;
  document.getElementById("o-stats").innerHTML=statCard("total",usd(tot),"Total valorizado")+statCard("",rows.length,"Líneas")+statCard("",provs,"Proveedores");
}
function ocRow(o,q){return "<tr><td style=\"font-weight:600;\">"+hl(o.insumo,q)+"</td><td><span class=\"cat-badge c-"+esc(o.tipo)+"\">"+esc(o.tipo)+"</span></td><td style=\"color:var(--sub);\">"+esc(o.campana)+"</td><td style=\"color:var(--sub);font-size:11px;\">"+esc(o.referencia)+"</td><td class=\"r\">"+fmtN(o.volumen)+"</td><td class=\"r\">"+fmtN(o.precio)+"</td><td class=\"r val\">"+usd(o.total)+"</td></tr>";}
function ocTable(rows,q,showProv){
  var head="<thead><tr>"+(showProv?"<th>Proveedor</th>":"")+"<th>Insumo</th><th>Tipo</th><th>Campaña</th><th>Referencia</th><th class=\"r\">Volumen</th><th class=\"r\">Precio U. (US$)</th><th class=\"r\">Total (US$)</th></tr></thead>";
  var body=rows.map(o=>showProv?"<tr><td>"+hl(o.proveedor,q)+"</td>"+ocRow(o,q).slice(4):ocRow(o,q)).join("");
  return "<table>"+head+"<tbody>"+body+"</tbody></table>";
}
function renderOC(){
  document.getElementById("src-o").textContent=srcTxt(SNAP_OC);
  var q=document.getElementById("o-q").value.trim().toLowerCase(),ft=document.getElementById("o-ftipo").value;
  fillSel("o-ftipo",[...new Set(OC.map(o=>o.tipo).filter(Boolean))].sort(),"Todos los tipos");
  var rows=OC.filter(o=>(!ft||o.tipo===ft)&&(!q||o.proveedor.toLowerCase().includes(q)||o.insumo.toLowerCase().includes(q)||(o.referencia||"").toLowerCase().includes(q)));
  renderOCStats(rows);
  var cont=document.getElementById("o-list");
  if(!rows.length){cont.innerHTML="<div class=\"empty\">Sin resultados.</div>";return;}
  if(ogrp==="none"){cont.innerHTML="<div class=\"pto\"><div class=\"pto-body\" style=\"display:block;border-top:0;\">"+ocTable(rows,q,true)+"</div></div>";return;}
  var pg={};rows.forEach(o=>{(pg[o.proveedor]=pg[o.proveedor]||[]).push(o);});
  var h="";
  Object.keys(pg).sort((a,b)=>pg[b].reduce((s,o)=>s+o.total,0)-pg[a].reduce((s,o)=>s+o.total,0)).forEach(function(prov){
    var gs=pg[prov],gt=gs.reduce((s,o)=>s+o.total,0),col=ocol.has(prov);
    h+="<div class=\"zona-grp"+(col?" col":"")+"\"><div class=\"group-h\" onclick=\"toggleProv('"+prov.replace(/'/g,"\\'")+"')\"><span class=\"chev\">&#9654;</span><span>"+esc(prov)+"</span><span class=\"cnt\">"+gs.length+" líneas</span><span class=\"gval\">"+usd(gt)+"</span></div><div class=\"zona-body\"><div class=\"pto\"><div class=\"pto-body\" style=\"display:block;border-top:0;\">"+ocTable(gs,q,false)+"</div></div></div></div>";
  });
  cont.innerHTML=h;
}
function toggleProv(p){if(ocol.has(p))ocol.delete(p);else ocol.add(p);renderOC();}

// ===== wiring =====
document.getElementById("tabs").addEventListener("click",function(e){if(e.target.tagName!=="BUTTON")return;var t=e.target.getAttribute("data-t");[...document.querySelectorAll(".tabs button")].forEach(b=>b.classList.toggle("on",b===e.target));document.getElementById("tab-metricas").classList.toggle("on",t==="metricas");document.getElementById("tab-puntos").classList.toggle("on",t==="puntos");document.getElementById("tab-pendiente").classList.toggle("on",t==="pendiente");if(t==="metricas")renderMetricas();if(t==="puntos")renderPuntos();if(t==="pendiente")renderOC();});
document.getElementById("p-grp").addEventListener("click",function(e){if(e.target.tagName!=="BUTTON")return;grp=e.target.getAttribute("data-g");[...document.querySelectorAll("#p-grp button")].forEach(b=>b.classList.toggle("on",b===e.target));renderPuntos();});
document.getElementById("o-grp").addEventListener("click",function(e){if(e.target.tagName!=="BUTTON")return;ogrp=e.target.getAttribute("data-g");[...document.querySelectorAll("#o-grp button")].forEach(b=>b.classList.toggle("on",b===e.target));renderOC();});
["p-q","p-fzona","p-fresp","p-fcat"].forEach(id=>document.getElementById(id).addEventListener("input",renderPuntos));
["o-q","o-ftipo"].forEach(id=>document.getElementById(id).addEventListener("input",renderOC));
document.getElementById("p-exp").addEventListener("click",()=>document.querySelectorAll("#p-list .pto").forEach(p=>p.classList.add("open")));
document.getElementById("p-col").addEventListener("click",()=>document.querySelectorAll("#p-list .pto").forEach(p=>p.classList.remove("open")));
document.getElementById("o-exp").addEventListener("click",()=>{ocol.clear();renderOC();});
document.getElementById("o-col").addEventListener("click",()=>{OC.forEach(o=>ocol.add(o.proveedor));renderOC();});
document.getElementById("p-export").addEventListener("click",exportValid);

// ===== boot =====
if(CONNECTED && typeof msal!=="undefined"){ initMsal().catch(function(e){document.getElementById("gate-sp").style.display="none";document.getElementById("gate-msg").innerHTML="Error de login: "+e.message;}); }
else { DEMO=true; bootApp(); }
</script>
</body></html>
